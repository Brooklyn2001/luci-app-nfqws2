name: Build and publish APK

on:
  workflow_dispatch:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-openwrt:
    runs-on: ubuntu-22.04
    container:
      image: openwrt/sdk:x86_64
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init SDK
        working-directory: /builder
        run: |
          HOME=/builder ./setup.sh

      - name: Copy signing keys
        env:
          OPENWRT_APK_PUBLIC_KEY: ${{ secrets.OPENWRT_APK_PUBLIC_KEY }}
          OPENWRT_APK_SECRET_KEY: ${{ secrets.OPENWRT_APK_SECRET_KEY }}
        run: |
          printf '%s' "$OPENWRT_APK_SECRET_KEY" > /builder/private-key.pem
          printf '%s' "$OPENWRT_APK_PUBLIC_KEY" > /builder/public-key.pem

      - name: Get version
        id: version
        run: |
          VERSION=$(cat $GITHUB_WORKSPACE/VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build package
        id: build
        working-directory: /builder
        run: |
          echo "src-link nfqws2 $GITHUB_WORKSPACE/openwrt" > feeds.conf
          ./scripts/feeds update nfqws2
          ./scripts/feeds install -a -p nfqws2
          make defconfig
          make CONFIG_NO_STRIP=y CONFIG_USE_APK=y package/luci-app-nfqws2/compile V=s
          make CONFIG_NO_STRIP=y CONFIG_USE_APK=y package/index V=s

      - name: Collect APK, keys and index
        if: steps.build.outcome == 'success'
        run: |
          echo "=== All APKs ==="
          find /builder/bin -name "*.apk" -ls
          APK_PATH=$(find /builder/bin -name "luci-app-nfqws2*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          mkdir -p /tmp/apk-out
          cp "$APK_PATH" /tmp/apk-out/luci-app-nfqws2.apk
          cp /builder/public-key.pem /tmp/apk-out/luci-app-nfqws2.pem
          cd /tmp/apk-out
          mkdir -p /tmp/apk-keys
          cp /builder/public-key.pem /tmp/apk-keys/luci-app-nfqws2.pem
          /builder/staging_dir/host/bin/apk index --repositories-file=/dev/null -k /tmp/apk-keys/luci-app-nfqws2.pem -o packages.adb *.apk
          /builder/staging_dir/host/bin/apk sign --private-key /builder/private-key.pem packages.adb

      - name: Upload artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-nfqws2-repo
          path: /tmp/apk-out/
          if-no-files-found: error

  publish-pages:
    needs: build-openwrt
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: luci-app-nfqws2-repo
          path: pages

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(cat VERSION)
          echo "Creating release v${VERSION}"
          gh release create "v${VERSION}" pages/luci-app-nfqws2.apk --title "v${VERSION}" --notes "Release v${VERSION}" --prerelease
