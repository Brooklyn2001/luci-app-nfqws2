name: Build and publish APK

on:
  workflow_dispatch:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  build-openwrt:
    runs-on: ubuntu-22.04
    container:
      image: openwrt/sdk:x86_64
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init SDK
        working-directory: /builder
        run: |
          HOME=/builder ./setup.sh

      - name: Copy signing keys
        env:
          OPENWRT_APK_PUBLIC_KEY: ${{ secrets.OPENWRT_APK_PUBLIC_KEY }}
          OPENWRT_APK_SECRET_KEY: ${{ secrets.OPENWRT_APK_SECRET_KEY }}
        run: |
          printf '%s' "$OPENWRT_APK_SECRET_KEY" > /builder/private-key.pem
          printf '%s' "$OPENWRT_APK_PUBLIC_KEY" > /builder/public-key.pem

          mkdir -p /builder/staging_dir/host/apk-keys
          cp /builder/public-key.pem /builder/staging_dir/host/apk-keys/luci-app-nfqws2.pem

          find /builder/staging_dir/targets -type d -name "apk" | while read d; do
            mkdir -p "$d/keys"
            cp /builder/public-key.pem "$d/keys/luci-app-nfqws2.pem"
          done

      - name: Get version
        id: version
        run: |
          VERSION=$(cat $GITHUB_WORKSPACE/VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build package
        id: build
        working-directory: /builder
        run: |
          echo "src-link nfqws2 $GITHUB_WORKSPACE/openwrt" > feeds.conf
          ./scripts/feeds update nfqws2
          ./scripts/feeds install -a -p nfqws2
          make defconfig
          make CONFIG_NO_STRIP=y CONFIG_USE_APK=y package/luci-app-nfqws2/compile V=s
          make CONFIG_NO_STRIP=y CONFIG_USE_APK=y package/index V=s

      - name: Validate APK
        if: steps.build.outcome == 'success'
        run: |
          APK_PATH=$(find /builder/bin -name "luci-app-nfqws2*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi
          echo "APK path: $APK_PATH"
          APK_SIZE=$(stat -c%s "$APK_PATH")
          echo "APK size: $APK_SIZE bytes"
          if [ "$APK_SIZE" -lt 1024 ]; then
            echo "ERROR: APK is too small ($APK_SIZE bytes), likely corrupted!"
            exit 1
          fi

          echo "=== APK ar contents ==="
          ar t "$APK_PATH"

          echo "=== Checking data.tar integrity ==="
          DATA_FILE=$(ar t "$APK_PATH" | grep -E 'data\.tar\.(gz|xz)')
          if [ -z "$DATA_FILE" ]; then
            echo "ERROR: No data.tar found in APK!"
            ar t "$APK_PATH"
            exit 1
          fi
          echo "Found: $DATA_FILE"

          ar p "$APK_PATH" "$DATA_FILE" > /tmp/data-archive
          DATA_SIZE=$(stat -c%s /tmp/data-archive)
          echo "data.tar size: $DATA_SIZE bytes"
          if [ "$DATA_SIZE" -lt 64 ]; then
            echo "ERROR: data.tar is too small, likely empty or corrupted!"
            exit 1
          fi

          file /tmp/data-archive
          echo "APK validation passed"

      - name: Collect APK and keys
        if: steps.build.outcome == 'success'
        run: |
          APK_PATH=$(find /builder/bin -name "luci-app-nfqws2*.apk" -type f | head -1)
          mkdir -p /tmp/apk-out
          cp "$APK_PATH" /tmp/apk-out/luci-app-nfqws2.apk
          cp /builder/public-key.pem /tmp/apk-out/luci-app-nfqws2.pem

      - name: Upload artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-nfqws2-release
          path: /tmp/apk-out/
          if-no-files-found: error

  publish-release:
    needs: build-openwrt
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: luci-app-nfqws2-release
          path: release

      - name: Delete old prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OLD_TAG=$(gh release --json tagName --jq '.tagName' 2>/dev/null | head -1)
          if [ -n "$OLD_TAG" ]; then
            echo "Deleting old release: $OLD_TAG"
            gh release delete "$OLD_TAG" --yes 2>/dev/null || true
          fi

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(cat VERSION)
          echo "Creating release v${VERSION}"
          gh release delete "v${VERSION}" --yes 2>/dev/null || true
          gh release create "v${VERSION}" \
            release/luci-app-nfqws2.apk \
            release/luci-app-nfqws2.pem \
            --title "v${VERSION}" \
            --notes "Release v${VERSION}" \
            --prerelease
