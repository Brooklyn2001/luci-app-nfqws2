name: Build and publish APK

on:
  workflow_dispatch:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-openwrt:
    runs-on: ubuntu-22.04
    container:
      image: openwrt/sdk:x86_64
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init SDK
        working-directory: /builder
        run: |
          HOME=/builder ./setup.sh

      - name: Copy signing keys
        env:
          OPENWRT_APK_PUBLIC_KEY: ${{ secrets.OPENWRT_APK_PUBLIC_KEY }}
          OPENWRT_APK_SECRET_KEY: ${{ secrets.OPENWRT_APK_SECRET_KEY }}
        run: |
          echo "$OPENWRT_APK_SECRET_KEY" > /builder/private-key.pem
          echo "$OPENWRT_APK_PUBLIC_KEY" > /builder/public-key.pem

      - name: Build package
        id: build
        working-directory: /builder
        run: |
          echo "src-link nfqws2 $GITHUB_WORKSPACE/openwrt" > feeds.conf
          ./scripts/feeds update nfqws2
          ./scripts/feeds install -a -p nfqws2
          make defconfig
          make CONFIG_NO_STRIP=y CONFIG_USE_APK=y package/luci-app-nfqws2/compile V=s
          make CONFIG_NO_STRIP=y CONFIG_USE_APK=y package/index V=s

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-nfqws2-apk
          path: /builder/bin/packages/*/nfqws2/luci-app-nfqws2_*
          if-no-files-found: error

      - name: List built packages
        run: |
          echo "=== Built packages ==="
          find /builder/bin/packages -name "luci-app-nfqws2*" -ls

  create-release:
    needs: build-openwrt
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: luci-app-nfqws2-apk
          path: out

      - name: List artifacts
        run: ls -la out/

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: "Release v${{ github.run_number }}"
          draft: false
          prerelease: true

      - name: Upload APK to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./out/luci-app-nfqws2_*.apk
          asset_name: luci-app-nfqws2.apk
          asset_content_type: application/octet-stream
